[project]
name = "onuw"
version = "0.1.0"
description = "One Night Ultimate Werewolf — deterministic multi-agent engine"
readme = "README.md"
authors = [
    { name = "ScudBt", email = "zhy1594102803@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.136.3",
    "google-genai>=2.7.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
]

